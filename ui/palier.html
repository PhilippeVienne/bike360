<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bike360 — mon palier</title>
<link rel="stylesheet" href="style.css">
<style>
header.top { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
header.top .spacer { flex: 1; }
main.lib { max-width: 760px; margin: 24px auto; padding: 0 16px; display: flex; flex-direction: column; gap: 14px; }
main.lib progress { width: 100%; }
.lib-list { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.lib-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.lib-row .grow { flex: 1; min-width: 220px; }
.lib-row .muted { font-size: 12px; }
</style>
</head>
<body>
<header class="top"><div class="brand">◉ Bike360</div><div class="spacer"></div><a href="bibliotheque.html">Mes rushs</a><span class="muted">Mon palier</span><span id="account"></span></header>
<main class="lib">
  <h2>Mon palier</h2>
  <div id="usage"></div>
  <div id="message" class="muted"></div>
  <h3>Paliers</h3>
  <ul id="plans" class="lib-list"></ul>
  <p class="muted">Abonnement annuel, payé en ligne. TVA non applicable, article 293 B du CGI.</p>
</main>
<script type="module" src="palier.js"></script>
</body>
</html>
