<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bike360 — pit-stop</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="icons/icon-192.png">
<style>
header.top { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
header.top .spacer { flex: 1; }
main.ps { max-width: 980px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; grid-template-columns: 320px 1fr; align-items: start; }
@media (max-width: 760px) { main.ps { grid-template-columns: 1fr; } }
form.ps-form { display: flex; flex-direction: column; gap: 10px; padding: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
form.ps-form label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
form.ps-form input, form.ps-form select { padding: 8px 10px; background: var(--bg); color: inherit; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
form.ps-form .row2 { display: flex; gap: 8px; }
form.ps-form .row2 > label { flex: 1; }
#ps-map { height: 320px; border-radius: 12px; border: 1px solid var(--line); margin-bottom: 10px; }
.ps-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.ps-row { display: flex; align-items: baseline; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.ps-row .name { flex: 1; font-weight: 600; }
.ps-row .price { color: var(--accent); font-weight: 700; }
.ps-row.no-price { opacity: .65; }
.ps-row .muted { font-size: 12px; }
</style>
</head>
<body>
<header class="top"><div class="brand">◉ Bike360</div><div class="spacer"></div><span class="muted">Pit-stop</span></header>
<main class="ps">
  <form id="form" class="ps-form">
    <div class="row2">
      <label>Latitude <input id="lat" type="number" step="any" required></label>
      <label>Longitude <input id="lon" type="number" step="any" required></label>
    </div>
    <button id="locate" type="button">📍 Utiliser ma position</button>
    <label>Rayon de recherche (km) <input id="radius" type="number" min="1" max="100" value="20"></label>
    <label>Carburant
      <select id="fuel">
        <option value="gazole">Gazole</option>
        <option value="sp95">SP95</option>
        <option value="sp98">SP98</option>
        <option value="e10">E10</option>
      </select>
    </label>
    <div class="row2">
      <label>Plein (L) <input id="fill" type="number" min="0" step="0.5" value="12"></label>
      <label>Conso (L/100km) <input id="consumption" type="number" min="0.1" step="0.1" value="5"></label>
    </div>
    <label><input id="exclude_distance" type="checkbox"> Ignorer le coût du détour</label>
    <button id="search" class="primary" type="submit">Chercher</button>
    <div id="message" class="muted"></div>
  </form>
  <div>
    <div id="ps-map"></div>
    <ul id="results" class="ps-list"></ul>
  </div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module" src="pitstop.js"></script>
</body>
</html>
