[package]
name = "bike360-cloud"
version = "0.1.0"
edition = "2024"
license = "EUPL-1.2"

# Hors de l'espace de travail principal : le kit AWS est long à compiler et ne sert qu'au service hébergé.
[workspace]

# service commun (Envoi et Bibliothèque) et exécutant des tâches déposées dans la file
[[bin]]
name = "bike360-envoi"
path = "src/main.rs"

[[bin]]
name = "bike360-worker"
path = "src/worker.rs"

[dependencies]
anyhow = "1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-cognitoidentityprovider = "1"
aws-sdk-dynamodb = "1"
aws-sdk-s3 = "1"
aws-sdk-sqs = "1"
axum = "0.8"
bike360-core = { path = "../../core" }
chrono = "0.4"
hmac = "0.12"
jsonwebtoken = "9"
clap = { version = "4", features = ["derive", "env"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "process", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs"] }
ureq = { version = "2", features = ["json"] }
