[package]
name = "insta-server"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "insta-server"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
insta-core = { path = "../core" }
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
sha1_smol = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
