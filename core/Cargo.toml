[package]
name = "insta-core"
version = "0.1.0"
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
ureq = { version = "2", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ab_glyph = "0.2"
